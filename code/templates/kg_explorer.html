<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>农业知识图谱 · 检索联动探索</title>
<script src="{{ url_for('static', filename='echarts.min.js') }}"></script>
<script>
  if (typeof echarts === 'undefined') {
    document.write('<' + 'script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"><' + '/script>');
  }
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#f4f6f9;color:#1f2937;height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(100deg,#2F5597,#3f7d5f);color:#fff;padding:11px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;flex:none}
header h1{font-size:17px;font-weight:600}
header span{font-size:12.5px;opacity:.88}
header a{color:#fff;font-size:12.5px;text-decoration:none;border:1px solid rgba(255,255,255,.5);padding:3px 10px;border-radius:6px}
header a:hover{background:rgba(255,255,255,.15)}
.wrap{flex:1;display:flex;gap:12px;padding:12px 16px;min-height:0}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
/* 重要：ECharts init 会清空容器内的所有子节点，
   因此 #main 必须是"纯图表容器"，浮层（工具栏/状态/面包屑）放在外层包裹层里 */
.chart-wrap{flex:1;min-width:0;position:relative;overflow:hidden}
#main{position:absolute;inset:0}
#side{width:372px;flex:none;display:flex;flex-direction:column;gap:10px;overflow:auto}
.card{padding:11px 13px}
.card h3{font-size:13px;color:#374151;margin-bottom:8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
#search{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;font-family:inherit;outline:none}
#search:focus{border-color:#2F5597;box-shadow:0 0 0 3px rgba(47,85,151,.12)}
#hint{font-size:12px;color:#6b7280;margin-top:7px;line-height:1.7}
.cand{padding:5px 9px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;font-size:12.5px}
.cand:hover,.cand.on{background:#eef3fb}
.cand .lt{color:#94a3b8;font-size:11.5px}
.stat{display:flex;gap:7px;flex-wrap:wrap}
.stat .chip{background:#f1f5f9;border-radius:6px;padding:4px 9px;font-size:12px;color:#334155}
.stat .chip b{color:#2F5597}
.bar{display:flex;align-items:center;gap:7px;font-size:12px;padding:2.5px 0;cursor:pointer;border-radius:5px}
.bar:hover{background:#f8fafc}
.bar i{font-style:normal;width:74px;flex:none;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar u{flex:1;height:8px;background:#eef2f7;border-radius:4px;overflow:hidden}
.bar em{display:block;height:100%;border-radius:4px}
.bar s{text-decoration:none;color:#64748b;width:30px;text-align:right;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.toolbar{position:absolute;left:12px;top:12px;display:flex;gap:7px;align-items:center;z-index:9;flex-wrap:wrap}
button{font-family:inherit;font-size:12.5px;padding:5px 12px;border-radius:7px;border:1px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer}
button:hover{border-color:#2F5597;color:#2F5597}
button.pri{background:#2F5597;border-color:#2F5597;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
#crumb{position:absolute;left:12px;bottom:11px;font-size:12.5px;background:rgba(255,255,255,.94);border:1px solid #e2e8f0;border-radius:7px;padding:5px 11px;z-index:9}
#crumb a{color:#2F5597;cursor:pointer;text-decoration:none}
#crumb span{color:#94a3b8;margin:0 2px}
#badge{position:absolute;right:12px;top:12px;font-size:12px;background:rgba(255,255,255,.94);border:1px solid #e2e8f0;border-radius:7px;padding:5px 11px;color:#475569;z-index:9}
#detail{font-size:12.5px;line-height:1.85;max-height:250px;overflow:auto}
.tag{display:inline-block;background:#eef3fb;color:#2F5597;border-radius:5px;padding:1px 7px;margin:1.5px 3px 1.5px 0;font-size:11.5px;cursor:pointer}
.tag:hover{background:#dbe7f8}
.rel{font-size:12px;line-height:1.95}
.empty{color:#94a3b8;font-size:12px}
@media(max-width:900px){.wrap{flex-direction:column}#side{width:100%}.chart-wrap{min-height:360px;flex:none;height:60vh}}
</style>
</head>
<body>
    {% include '_nav.html' %}
<header>
  <h1>农业知识图谱 · 检索联动探索</h1>
  <span>右侧检索实体 → 左侧图谱自动定位并展开该实体的知识网络</span>
</header>

<div class="wrap">
  <div class="chart-wrap panel">
    <div id="main"></div>
    <div class="toolbar">
      <button id="btnBack" title="返回上一级">← 返回</button>
      <button id="btnFull" class="pri">全图</button>
      <button id="btnD1" class="pri">1 跳</button>
      <button id="btnD2">2 跳</button>
      <span style="font-size:11.5px;color:#94a3b8">双击节点下钻 · 双击空白返回</span>
    </div>
    <div id="badge">加载中…</div>
    <div id="crumb"></div>
  </div>

  <div id="side">
    <div class="card panel">
      <h3>实体检索</h3>
      <input id="search" placeholder="输入作物 / 病虫害 / 肥料 / 土壤 / 产区…" autocomplete="off">
      <div id="hint">支持名称模糊匹配，回车定位第一个结果。</div>
    </div>
    <div class="card panel">
      <h3>图谱规模 <span style="font-size:11px;color:#94a3b8" id="src">Neo4j</span></h3>
      <div class="stat" id="stats"><span class="empty">统计加载中…</span></div>
    </div>
    <div class="card panel">
      <h3 id="relTitle">关系类型分布</h3>
      <div id="relstat"><span class="empty">加载中…</span></div>
    </div>
    <div class="card panel">
      <h3>实体详情</h3>
      <div id="detail"><span class="empty">未选中节点</span></div>
    </div>
    <div class="card panel">
      <h3>实体类型</h3>
      <div id="labelstat"><span class="empty">加载中…</span></div>
    </div>
  </div>
</div>

<script>
'use strict';
const LS_COLOR = {
  '作物':'#2F5597','病虫害':'#d9534f','杂草':'#a8763e','地域':'#2196F3','农药肥料':'#00BCD4',
  '栽培要点':'#3f7d5f','土壤':'#FF9800','气候':'#9C27B0','生育期':'#7c9cbf','品种':'#e6a23c',
  '作物类别':'#64748b','养分元素':'#16a085','季节':'#c07bb8','防治措施':'#5b8c5a','中心':'#0f172a'
};
let GRAPH = {nodes:[], links:[]};
let adj = {}, byId = {}, mode = 'full', focusId = null, depth = 1, trail = [];
const badge = document.getElementById('badge');
const detail = document.getElementById('detail');
const crumb = document.getElementById('crumb');

if (typeof echarts === 'undefined') {
  badge.textContent = '未加载 ECharts：请确认 static/echarts.min.js 存在';
  badge.style.background = '#fee2e2';
  throw new Error('echarts not loaded');
}
const chart = echarts.init(document.getElementById('main'));

function colorOf(label){ return LS_COLOR[label] || '#94a3b8'; }
/* 扩展图谱标签 → 项目 Neo4j 标签，保证全图与子图配色一致 */
const LABEL_ALIAS = {'农作物':'作物','土壤类型':'土壤','气候类型':'气候','产区':'地域',
                     '农事操作':'栽培要点','肥料':'农药肥料','防治措施':'防治措施'};
function norm(l){ return LABEL_ALIAS[l] || l; }

/* ---------------------------------------------------- 数据加载 */
fetch('/api/kg/dataset').then(r => r.json()).then(d => {
  GRAPH.nodes = d.nodes.map(n => ({id:n.id, name:n.name, label:norm(n.label), cat:n.cat}));
  GRAPH.links = d.links.map(l => ({s:l.s, t:l.t, r:l.relation}));
  byId = {}; adj = {};
  GRAPH.nodes.forEach(n => byId[n.id] = n);
  GRAPH.links.forEach(l => {
    (adj[l.s] = adj[l.s] || []).push({id:l.t, rel:l.r, dir:'out'});
    (adj[l.t] = adj[l.t] || []).push({id:l.s, rel:l.r, dir:'in'});
  });
  const labelCnt = {};
  GRAPH.nodes.forEach(n => labelCnt[n.label] = (labelCnt[n.label]||0)+1);
  document.getElementById('stats').innerHTML = [
    ['节点', GRAPH.nodes.length], ['关系', GRAPH.links.length],
    ['实体类型', Object.keys(labelCnt).length]
  ].map(x => `<span class="chip"><b>${x[1]}</b> ${x[0]}</span>`).join('');
  const items = Object.entries(labelCnt).sort((a,b)=>b[1]-a[1]);
  const mx = Math.max(...items.map(x => x[1]), 1);
  document.getElementById('labelstat').innerHTML = items.map(([l,c]) =>
    `<div class="bar"><span class="dot" style="background:${colorOf(l)}"></span><i>${l}</i>
     <u><em style="background:${colorOf(l)};width:${Math.max(4,c/mx*100)}%"></em></u><s>${c}</s></div>`).join('');
  renderFull();
  document.getElementById('search').focus();
}).catch(e => { badge.textContent = '数据加载失败：' + e.message; });

/* ---------------------------------------------------- 关系柱状 */
function renderRelStat(items){
  if(!items.length){ document.getElementById('relstat').innerHTML = '<span class="empty">暂无</span>'; return; }
  const mx = Math.max(...items.map(x => x[1]));
  document.getElementById('relstat').innerHTML = items.map(r => {
    const col = r[2] ? '#2F5597' : '#94a3b8';
    return `<div class="bar" data-rel="${r[0]}"><span class="dot" style="background:${col}"></span>
      <i title="${r[0]}">${r[0]}</i><u><em style="background:${col};width:${Math.max(4,r[1]/mx*100)}%"></em></u><s>${r[1]}</s></div>`;
  }).join('');
}

/* ---------------------------------------------------- 全图视图 */
function renderFull(){
  mode = 'full'; focusId = null;
  document.getElementById('relTitle').textContent = '关系类型分布（全图）';
  const cnt = {};
  GRAPH.links.forEach(l => cnt[l.r] = (cnt[l.r]||0)+1);
  renderRelStat(Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,18).map(x=>[x[0],x[1],1]));
  badge.textContent = `全图视图 · ${GRAPH.nodes.length} 节点 / ${GRAPH.links.length} 关系`;
  updateCrumb();
  chart.setOption({
    backgroundColor:'#fff',
    tooltip:{formatter:p => p.dataType==='node'
      ? `<b>${p.data.name}</b><br/>类型：${p.data.label}<br/><span style="color:#94a3b8">单击看详情，双击聚焦</span>`
      : `${p.data.sname} — ${p.data.tname}<br/>关系：${p.data.r}`},
    legend:[{data:Object.keys(LS_COLOR), top:8, left:12, itemWidth:11, itemHeight:11,
             textStyle:{fontSize:11,color:'#4b5563'}}],
    animationDuration:700,
    series:[{
      id:'g', type:'graph', layout:'force', roam:true, draggable:true,
      data:GRAPH.nodes.map(n => ({id:n.id, name:n.name, label:n.label, category:n.cat,
        symbolSize: Math.max(7, Math.min(28, 6 + Math.sqrt((adj[n.id]||[]).length)*2.3)),
        itemStyle:{color:colorOf(n.label), borderColor:'#fff', borderWidth:.6},
        label:{show:(adj[n.id]||[]).length>9 || n.label==='作物', fontSize:10, color:'#1f2937'}})),
      links:GRAPH.links.map(l => ({source:l.s, target:l.t, r:l.r,
        sname:byId[l.s]?byId[l.s].name:l.s, tname:byId[l.t]?byId[l.t].name:l.t})),
      categories:[...new Set(GRAPH.nodes.map(n=>n.label))].map(l => ({name:l, itemStyle:{color:colorOf(l)}})),
      force:{repulsion:78, gravity:.06, edgeLength:[26,68], friction:.12},
      emphasis:{focus:'adjacency', scale:1.15, lineStyle:{width:2.2}},
      lineStyle:{color:'#c8d2de', width:.5, curveness:.12, opacity:.6},
      labelLayout:{hideOverlap:true}
    }]
  }, true);
}

/* ---------------------------------------------------- 聚焦视图（服务端取子图） */
function focusOn(name, keepTrail){
  if(!name) return;
  if(!keepTrail){
    if(focusId && focusId !== name) trail.push(focusId);
    else if(!focusId) trail = [];
  }
  badge.textContent = `正在检索「${name}」…`;
  fetch(`/api/kg/subgraph?name=${encodeURIComponent(name)}&depth=${depth}`)
    .then(r => r.json())
    .then(d => {
      if(!d.nodes || !d.nodes.length){ badge.textContent = `未找到「${name}」的相关子图`; return; }
      renderFocus(d, name);
    })
    .catch(e => badge.textContent = '子图查询失败：' + e.message);
}

function renderFocus(d, root){
  mode = 'focus'; focusId = root;
  const nodes = d.nodes, links = d.links;
  const lv = {}; nodes.forEach(n => lv[n.name] = n.depth);
  const lv1 = nodes.filter(n => n.depth === 1).map(n => n.name);

  /* 按关系类型做角向扇区划分 */
  const groups = new Map();
  lv1.forEach(name => {
    const e = (links.find(l => (l.source === root && l.target === name) ||
                               (l.target === root && l.source === name)) || {});
    const key = e.type || '关联';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(name);
  });
  const list = [...groups.entries()].sort((a,b) => b[1].length - a[1].length);
  const total = lv1.length || 1;
  const R1 = Math.max(230, Math.min(390, 170 + total * 2.2));
  const R2 = R1 + 148, R3 = R2 + 150;
  const pos = {}, relOf = {}; pos[root] = [0,0];
  let a0 = -Math.PI / 2;
  list.forEach(([key, names]) => {
    const span = names.length / total * Math.PI * 2, step = span / names.length;
    const two = names.length > 10;
    names.forEach((name, i) => {
      const ring = two ? (i % 2) : 0;
      const ang = a0 + (i + .5) * step + ring * step / 2;
      const r = R1 + ring * 148;
      pos[name] = [Math.cos(ang) * r, Math.sin(ang) * r];
      relOf[name] = key;
    });
    a0 += span;
  });
  const byParent = new Map();
  nodes.filter(n => n.depth >= 2).forEach(n => {
    const e = links.find(l => (l.source === n.name && lv[l.target] === n.depth - 1) ||
                             (l.target === n.name && lv[l.source] === n.depth - 1));
    const p = e ? (e.source === n.name ? e.target : e.source) : root;
    if(!byParent.has(p)) byParent.set(p, []);
    byParent.get(p).push(n.name);
  });
  byParent.forEach((kids, pk) => {
    const pp = pos[pk] || [0,0], base = Math.atan2(pp[1], pp[0]);
    const r = Math.max(R3, Math.hypot(pp[0], pp[1]) + 150);
    const spread = Math.min(1.0, .16 + kids.length * .05);
    kids.forEach((name, j) => {
      const t = kids.length === 1 ? 0 : (j / (kids.length - 1) - .5);
      pos[name] = [Math.cos(base + t*spread) * r, Math.sin(base + t*spread) * r];
    });
  });

  let maxR = 120;
  Object.values(pos).forEach(p => maxR = Math.max(maxR, Math.hypot(p[0], p[1])));
  const el = document.getElementById('main');
  const W = Math.max(320, el.clientWidth || 800), H = Math.max(280, el.clientHeight || 560);
  const sc = Math.min(W, H) / 2 / (maxR + 70);

  const relCnt = {};
  links.forEach(l => relCnt[l.type] = (relCnt[l.type]||0)+1);
  const sortedRel = Object.entries(relCnt).sort((a,b)=>b[1]-a[1]);
  document.getElementById('relTitle').textContent = '当前实体关系类型';
  const mx = Math.max(...sortedRel.map(x=>x[1]), 1);
  document.getElementById('relstat').innerHTML = sortedRel.map(([r,c]) =>
    `<div class="bar"><span class="dot" style="background:#2F5597"></span><i title="${r}">${r}</i>
     <u><em style="background:#2F5597;width:${Math.max(4,c/mx*100)}%"></em></u><s>${c}</s></div>`).join('');

  const eNodes = nodes.map(n => {
    const p = pos[n.name] || [0,0], isRoot = n.name === root;
    const deg = nodes.filter(x => links.some(l => (l.source===x.name&&l.target===n.name)||(l.target===x.name&&l.source===n.name))).length;
    const px = p[0]*sc, py = p[1]*sc;
    return {id:n.name, name:n.name, label:n.label, x:px, y:py,
      symbolSize: isRoot ? 36 : (n.depth===1 ? Math.max(11, Math.min(26, 9 + Math.sqrt(deg)*2.1)) : 7),
      itemStyle:{color: isRoot ? '#0f172a' : colorOf(n.label), borderColor: isRoot ? '#0f172a' : '#fff', borderWidth: isRoot ? 2 : .8},
      label:{show: isRoot || n.depth===1, fontSize: isRoot ? 13 : 10.5, color:'#1f2937',
             position: isRoot ? 'bottom' : (px >= 0 ? 'right' : 'left'), offset: isRoot ? 6 : 5},
      emphasis:{label:{show:true}}};
  });
  const eLinks = links.map(l => {
    const isL1 = (l.source === root || l.target === root);
    return {source:l.source, target:l.target, r:l.type,
      lineStyle:{color: isL1 ? '#7f9dc4' : '#dde3ec', width: isL1 ? 1.4 : .6, curveness:0, opacity: isL1 ? .95 : .5},
      label:{show:false}};
  });

  chart.setOption({
    backgroundColor:'#fff',
    tooltip:{formatter:p => p.dataType==='node'
      ? `<b>${p.data.name}</b><br/>类型：${p.data.label}<br/><span style="color:#94a3b8">单击聚焦该实体</span>`
      : `${p.data.source} — ${p.data.target}<br/>关系：${p.data.r}`},
    animationDuration:450, animationEasingUpdate:'cubicOut',
    series:[{id:'g', type:'graph', layout:'none', roam:true, draggable:true,
      data:eNodes, links:eLinks,
      categories:[...new Set(nodes.map(n=>n.label))].map(l => ({name:l, itemStyle:{color:colorOf(l)}})),
      emphasis:{focus:'adjacency', scale:1.12, lineStyle:{width:2.4}},
      labelLayout:{hideOverlap:true},
      lineStyle:{color:'#cbd5e1', width:1}}]
  }, true);

  badge.textContent = `聚焦：${root} · ${nodes.length} 节点 / ${links.length} 关系 · 单击节点下钻，双击空白返回`;
  loadDetail(root);
  updateCrumb();
}

/* ---------------------------------------------------- 详情与面包屑 */
function loadDetail(name){
  detail.innerHTML = '<span class="empty">加载中…</span>';
  fetch(`/api/kg/profile/${encodeURIComponent(name)}`)
    .then(r => r.json())
    .then(p => {
      if(!p || !p.name){ detail.innerHTML = '<span class="empty">未找到该实体</span>'; return; }
      let h = `<div style="margin-bottom:6px"><b style="font-size:14px">${p.name}</b> ` +
              (p.labels||[]).map(l => `<span class="tag" style="cursor:default">${l}</span>`).join('') + `</div>`;
      const skip = ['name'];
      Object.entries(p.props||{}).forEach(([k,v]) => {
        if(skip.includes(k) || v === null || v === '') return;
        h += `<div><span style="color:#6b7280">${k}：</span>${v}</div>`;
      });
      h += `<div style="margin-top:8px"><button class="pri" onclick="focusOn('${p.name}')" style="width:100%">在图谱中聚焦该实体</button></div>`;
      const by = Object.entries(p.relations||{});
      h += `<div style="margin-top:10px;color:#2F5597;font-weight:600">关联实体（${by.reduce((a,[,v])=>a+v.length,0)}）</div>`;
      by.forEach(([rel, items]) => {
        h += `<div class="rel"><b style="color:#2F5597">→ ${rel}</b> ` +
             items.slice(0,14).map(x => `<span class="tag" data-go="${x.name}">${x.name}</span>`).join('') +
             (items.length > 14 ? ' …' : '') + `</div>`;
      });
      const inc = Object.entries(p.incoming||{});
      if(inc.length){
        h += `<div style="margin-top:8px;color:#6b7280;font-weight:600">被引用</div>`;
        inc.slice(0,8).forEach(([rel, items]) => {
          h += `<div class="rel"><b style="color:#6b7280">← ${rel}</b> ` +
               items.slice(0,12).map(x => `<span class="tag" data-go="${x.name}">${x.name}</span>`).join('') +
               (items.length > 12 ? ' …' : '') + `</div>`;
        });
      }
      detail.innerHTML = h;
      detail.querySelectorAll('[data-go]').forEach(el => el.onclick = () => focusOn(el.dataset.go));
    })
    .catch(e => detail.innerHTML = '<span class="empty">详情加载失败</span>');
}

function updateCrumb(){
  document.getElementById('btnBack').disabled = trail.length === 0;
  let h = `<a data-crumb="-1">全图</a>`;
  trail.forEach((t, i) => { h += ` <span>›</span> <a data-crumb="${i}">${t}</a>`; });
  if(mode === 'focus' && focusId && trail[trail.length-1] !== focusId){
    h += ` <span>›</span> <b style="color:#2F5597">${focusId}</b>`;
  }
  crumb.innerHTML = h;
  crumb.querySelectorAll('[data-crumb]').forEach(el => el.onclick = () => {
    const k = +el.dataset.crumb;
    if(k < 0) goFull();
    else { trail = trail.slice(0, k + 1); focusOn(trail[trail.length-1], true); }
  });
}
function goBack(){ if(trail.length){ const last = trail.pop(); if(last) focusOn(last, true); else goFull(); } }
function goFull(){ trail = []; focusId = null; renderFull(); detail.innerHTML = '<span class="empty">未选中节点</span>'; }

/* ---------------------------------------------------- 交互 */
chart.on('click', p => { if(p.dataType === 'node') loadDetail(p.data.name); });
chart.on('dblclick', p => { if(p.dataType === 'node') focusOn(p.data.name); });
chart.getZr().on('dblclick', e => { if(!e.target && mode === 'focus') goBack(); });
document.getElementById('btnBack').onclick = goBack;
document.getElementById('btnFull').onclick = goFull;
document.getElementById('btnD1').onclick = () => { depth = 1; syncDepth(); if(focusId) focusOn(focusId, true); };
document.getElementById('btnD2').onclick = () => { depth = 2; syncDepth(); if(focusId) focusOn(focusId, true); };
function syncDepth(){
  document.getElementById('btnD1').className = depth === 1 ? 'pri' : '';
  document.getElementById('btnD2').className = depth === 2 ? 'pri' : '';
}

/* ---------------------------------------------------- 检索 */
const search = document.getElementById('search'), hint = document.getElementById('hint');
function showCand(list, q){
  if(!q){ hint.innerHTML = '支持名称模糊匹配，回车定位第一个结果。'; return; }
  if(!list.length){ hint.innerHTML = '<span style="color:#9ca3af">未找到匹配实体</span>'; return; }
  hint.innerHTML = '<div style="max-height:220px;overflow:auto">' + list.map((n,i) =>
    `<div class="cand${i===0?' on':''}" data-name="${n.name}"><span>${n.name}</span><span class="lt">${n.label}</span></div>`
  ).join('') + '</div>';
  hint.querySelectorAll('.cand').forEach(el => el.onclick = () => {
    search.value = el.dataset.name; focusOn(el.dataset.name);
  });
}
let timer = null;
search.addEventListener('input', () => {
  const q = search.value.trim();
  clearTimeout(timer);
  if(!q){ showCand([], ''); return; }
  timer = setTimeout(() => {
    fetch('/api/kg/search?q=' + encodeURIComponent(q)).then(r => r.json())
      .then(list => { showCand(list || [], q); window.__cands = list || []; })
      .catch(() => hint.innerHTML = '<span style="color:#9ca3af">检索失败</span>');
  }, 220);
});
search.addEventListener('keydown', e => {
  const list = window.__cands || [];
  if(e.key === 'Enter' && list.length){
    focusOn(list[0].name); search.value = list[0].name;
    hint.innerHTML = `已定位：<b>${list[0].name}</b>`;
  }
  if(e.key === 'Escape'){ search.value = ''; window.__cands = []; goFull(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.activeElement !== search) goBack();
});
window.addEventListener('resize', () => chart.resize());
window.addEventListener('error', ev => { badge.textContent = '页面脚本错误：' + ev.message; });

syncDepth();
</script>
</body>
</html>
