<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>农业知识图谱可视化</title>
    <!-- 本地优先，缺失时回退 CDN -->
    <script type="text/javascript" src="{{ url_for('static', filename='vis-network.min.js') }}"></script>
    <script type="text/javascript">
      if (typeof vis === 'undefined') {
        document.write('<' + 'script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/standalone/umd/vis-network.min.js"><' + '/script>');
      }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft Yahei", "PingFang SC", sans-serif; padding: 16px; background-color: #f4f6f9; color: #1f2937; }
        .container { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
        .header { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background-color: #fff;
                  border-radius: 10px; box-shadow: 0 1px 3px rgba(15,23,42,.08); flex-wrap: wrap; }
        .header h1 { font-size: 17px; color: #2F5597; font-weight: 600; }
        .header .tip { font-size: 12px; color: #94a3b8; }
        #cropSelect, #searchBox { padding: 8px 13px; border: 1px solid #cbd5e1; border-radius: 7px;
                  font-size: 13.5px; font-family: inherit; outline: none; }
        #cropSelect { min-width: 200px; }
        #searchBox { min-width: 260px; }
        #searchBox:focus, #cropSelect:focus { border-color: #2F5597; box-shadow: 0 0 0 3px rgba(47,85,151,.12); }
        .search-wrap { position: relative; }
        #cand { position: absolute; top: 40px; left: 0; right: 0; background: #fff; border: 1px solid #e2e8f0;
                border-radius: 8px; box-shadow: 0 6px 18px rgba(15,23,42,.10); z-index: 30; max-height: 250px; overflow: auto; display: none; }
        #cand div { padding: 7px 13px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; }
        #cand div:hover { background: #eef3fb; }
        #cand .lt { color: #94a3b8; font-size: 11.5px; }
        /* 主体：左「知识分类展示」+ 右「节点图谱」左右结构。
           两边等高（撑满一屏），左侧内容多就在自己内部滚动，标题吸顶不跑掉。
           ⚠ 视口窄于 1180px 时退回上下堆叠 —— 左右各分一半会把标签挤成竖排。 */
        .main { display: flex; gap: 14px; align-items: stretch;
                height: calc(100vh - 150px); min-height: 560px; }
        .network-section { flex: 1 1 auto; min-width: 0; background-color: #fff; border-radius: 10px;
                box-shadow: 0 1px 3px rgba(15,23,42,.08); overflow: hidden; position: relative; }
        #network { width: 100%; height: 100%; }
        #netBadge { position: absolute; left: 14px; top: 12px; font-size: 12.5px; color: #475569;
                background: rgba(255,255,255,.94); border: 1px solid #e2e8f0; border-radius: 7px; padding: 5px 11px; }
        .demo-section { flex: 0 0 46%; max-width: 760px; background-color: #fff; border-radius: 10px;
                box-shadow: 0 1px 3px rgba(15,23,42,.08); overflow-y: auto; padding: 0 18px 18px; }
        .demo-title { position: sticky; top: 0; z-index: 2; background: #fff;
                font-size: 15px; color: #334155; font-weight: 600; margin-bottom: 16px;
                padding: 18px 0 10px; border-bottom: 1px solid #eef2f7;
                display: flex; justify-content: space-between; align-items: baseline; }
        .demo-title small { font-weight: 400; color: #94a3b8; font-size: 12px; }
        /* 左侧列只有整页的 46%，卡片最小宽度跟着收窄，免得变成一列长条 */
        .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 13px; }
        .demo-item { padding: 13px 15px; border-radius: 8px; background-color: #f8fafc; border: 1px solid #eef2f7; }
        .demo-item-title { font-size: 13px; color: #2F5597; font-weight: 600; margin-bottom: 9px; }
        .attrs { font-size: 12.5px; color: #475569; line-height: 1.95; }
        .attrs span { color: #94a3b8; }
        .node-tag { display: inline-block; padding: 4px 11px; margin: 3px 4px 3px 0; border-radius: 14px;
                color: #fff; font-size: 12px; cursor: pointer; }
        .node-tag:hover { opacity: .85; }
        .empty-tip { text-align: center; color: #94a3b8; font-size: 13.5px; padding: 42px 0; }

        @media (max-width: 1180px) {
            .main { flex-direction: column; height: auto; min-height: 0; }
            .demo-section { flex: none; max-width: none; overflow: visible; padding: 18px; }
            .demo-title { position: static; padding: 0 0 10px; }
            .network-section { height: 460px; }
        }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <div class="container">
        <div class="header">
            <h1>农业知识图谱可视化</h1>
            <select id="cropSelect" onchange="loadAllData()">
                <option value="">-- 请选择作物 --</option>
                {% for crop in all_crops %}
                <option value="{{ crop }}">{{ crop }}</option>
                {% endfor %}
            </select>
            <div class="search-wrap">
                <input id="searchBox" placeholder="或直接搜索任意实体（病虫害 / 肥料 / 土壤 / 产区…）" autocomplete="off">
                <div id="cand"></div>
            </div>
            <span class="tip">单击节点继续展开 · 悬停连线看关系名 · 左侧按关系类型分类</span>
        </div>

        {# 左右结构：左边知识分类展示（内容多，自己内部滚动），右边节点图谱。
           窄屏（≤1180px）由 CSS 退回上下堆叠。 #}
        <div class="main">
            <div class="demo-section">
                <div class="demo-title"><span id="demoTitle">实体知识分类展示</span><small>点击标签可继续下钻</small></div>
                <div id="demoContent" class="demo-grid">
                    <div class="empty-tip">请选择作物或搜索实体以查看分类信息</div>
                </div>
            </div>

            <div class="network-section">
                <div id="network"></div>
                <div id="netBadge">请选择或搜索一个实体</div>
            </div>
        </div>
    </div>

    <script>
        'use strict';
        let network = null;
        let current = '';
        let depth = 1;

        /* 关系 → 配色（沿用图谱页的分类配色） */
        const REL_COLOR = {
            '主产区': '#2196F3', '适宜土壤': '#FF9800', '适宜气候': '#9C27B0',
            '适配肥料': '#00BCD4', '易感病害': '#F44336', '易感虫害': '#E57373',
            '易生杂草': '#a8763e', '防治方法': '#5b8c5a', '栽培要点': '#4CAF50',
            '生育期': '#7c9cbf', '需要养分': '#16a085', '含有养分': '#26a69a',
            '适宜轮作': '#6d4c41', '播种季节': '#9575cd', '收获季节': '#ba68c8',
            '主推品种': '#e6a23c', '品种属于': '#f0ad4e', '属于类别': '#64748b',
            '主要土壤': '#fb8c00', '属于气候区': '#8e24aa', '适用作物': '#0097a7',
            '常用改良剂': '#795548'
        };
        const LABEL_COLOR = { '作物': '#4CAF50', '病虫害': '#F44336', '杂草': '#a8763e',
            '地域': '#2196F3', '农药肥料': '#00BCD4', '栽培要点': '#3f7d5f', '土壤': '#FF9800',
            '气候': '#9C27B0', '生育期': '#7c9cbf', '品种': '#e6a23c', '作物类别': '#64748b',
            '养分元素': '#16a085', '季节': '#c07bb8', '防治措施': '#5b8c5a' };
        const GROUP_TITLE = {
            '主产区': '核心信息 - 主要种植区域', '适宜土壤': '生长条件 - 适配土壤类型',
            '适宜气候': '气候要求 - 适宜生长气候', '适配肥料': '施肥建议 - 推荐使用肥料',
            '易感病害': '病害风险 - 易感染病害', '易感虫害': '虫害风险 - 易感染虫害',
            '易生杂草': '草害风险 - 易发生杂草', '防治方法': '防治措施 - 推荐药剂与方法',
            '栽培要点': '栽培管理 - 关键农事操作', '生育期': '生育进程 - 各生育阶段',
            '需要养分': '养分需求 - 必需营养元素', '含有养分': '养分构成 - 本肥料含有的养分',
            '适宜轮作': '茬口安排 - 适宜前/后茬作物', '播种季节': '播期安排 - 适宜播种季节',
            '收获季节': '收获安排 - 主要收获季节', '主推品种': '品种推荐 - 主推品种',
            '属于类别': '作物归属 - 所属大类', '主要土壤': '区域土壤 - 主要分布土壤',
            '属于气候区': '气候归属 - 所属气候区', '适用作物': '适用对象 - 本措施适用作物',
            '常用改良剂': '土壤改良 - 常用改良剂', '品种属于': '品种归属 - 所属作物'
        };
        const GROUP_ORDER = ['属于类别', '主产区', '适宜土壤', '适宜气候', '生育期', '栽培要点',
            '适配肥料', '需要养分', '含有养分', '易感病害', '易感虫害',
            '易生杂草', '防治方法', '适用作物', '播种季节', '收获季节', '主推品种',
            '适宜轮作', '主要土壤', '属于气候区', '常用改良剂'];

        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('network');
            network = new vis.Network(container, { nodes: new vis.DataSet([]), edges: new vis.DataSet([]) }, {
                /* 节点：小圆点 + 带白色描边的文字标签，避免大色块糊成一团 */
                nodes: {
                    shape: 'dot',
                    borderWidth: 1.5,
                    borderColor: '#ffffff',
                    font: { face: 'Microsoft YaHei', size: 11, color: '#334155',
                            strokeWidth: 3, strokeColor: '#ffffff' },
                    scaling: { min: 5, max: 18 }
                },
                /* 连线：显示箭头但不显示关系文字（改由悬停提示），大幅降低视觉噪声 */
                edges: {
                    arrows: { to: { enabled: true, scaleFactor: .5 } },
                    color: { color: '#c8d4e2', opacity: .9 },
                    width: 1,
                    smooth: { enabled: true, type: 'continuous', roundness: .18 }
                },
                physics: {
                    enabled: true,
                    /* 改成左右结构后画布只剩大约一半宽，节点还是原来那么多 →
                       排斥调强一点、重叠避让调大，否则标签会糊成一团。
                       （原来整页宽时是 -110 / 155 / .34 / 280 次） */
                    forceAtlas2Based: { gravitationalConstant: -130, centralGravity: .008,
                                        springLength: 120, springConstant: .05, avoidOverlap: .6 },
                    stabilization: { iterations: 400 }
                },
                interaction: { dragNodes: true, zoomView: true, hover: true, tooltipDelay: 120 }
            });
            network.on('click', p => { if (p.nodes && p.nodes.length) drillTo(p.nodes[0]); });
            const box = document.getElementById('searchBox');
            box.addEventListener('input', () => suggest(box.value.trim()));
            box.addEventListener('keydown', e => {
                if (e.key === 'Enter') { const first = document.querySelector('#cand div'); if (first) pick(first.dataset.name); }
                if (e.key === 'Escape') { document.getElementById('cand').style.display = 'none'; }
            });
            document.addEventListener('click', e => {
                if (!e.target.closest('.search-wrap')) document.getElementById('cand').style.display = 'none';
            });
        });

        let timer = null;
        function suggest(q) {
            const box = document.getElementById('cand');
            if (!q) { box.style.display = 'none'; return; }
            clearTimeout(timer);
            timer = setTimeout(() => {
                fetch('/api/kg/search?q=' + encodeURIComponent(q)).then(r => r.json()).then(list => {
                    if (!list.length) { box.style.display = 'none'; return; }
                    box.innerHTML = list.slice(0, 14).map(n =>
                        `<div data-name="${n.name}"><span>${n.name}</span><span class="lt">${n.label}</span></div>`).join('');
                    box.style.display = 'block';
                    box.querySelectorAll('div').forEach(el => el.onclick = () => pick(el.dataset.name));
                });
            }, 220);
        }
        function pick(name) {
            document.getElementById('cand').style.display = 'none';
            document.getElementById('searchBox').value = name;
            document.getElementById('cropSelect').value = '';
            loadEntity(name);
        }
        function drillTo(name) { loadEntity(name); }

        function loadAllData() {
            const crop = document.getElementById('cropSelect').value.trim();
            if (!crop) { resetView(); return; }
            document.getElementById('searchBox').value = '';
            loadEntity(crop);
        }
        function resetView() {
            network.setData({ nodes: [], edges: [] });
            document.getElementById('demoContent').innerHTML = '<div class="empty-tip">请选择作物或搜索实体以查看分类信息</div>';
            document.getElementById('netBadge').textContent = '请选择或搜索一个实体';
        }

        /* 统一入口：先从 Neo4j 取子图 + 画像，再渲染 */
        function loadEntity(name, d) {
            current = name; depth = d || 1;
            document.getElementById('netBadge').textContent = '正在加载「' + name + '」…';
            Promise.all([
                fetch('/api/kg/subgraph?name=' + encodeURIComponent(name) + '&depth=' + depth).then(r => r.json()),
                fetch('/api/kg/profile/' + encodeURIComponent(name)).then(r => r.json())
            ]).then(([g, p]) => {
                if (!g.nodes || !g.nodes.length) {
                    document.getElementById('netBadge').textContent = '暂无 ' + name + ' 的相关数据';
                    network.setData({ nodes: [], edges: [] });
                    return;
                }
                const nodes = new vis.DataSet(), edges = new vis.DataSet();
                const relCnt = {};
                g.nodes.forEach(n => {
                    const isRoot = n.name === name;
                    nodes.add({
                        id: n.name, label: n.name,
                        /* 悬停显示"名称 + 类型" */
                        title: `${n.name}　[${n.label}]`,
                        color: { background: isRoot ? '#2F5597' : (LABEL_COLOR[n.label] || '#94a3b8'),
                                 border: '#ffffff' },
                        size: isRoot ? 15 : (n.depth === 1 ? 8 : 4.5),
                        borderWidth: isRoot ? 2 : 1.5,
                        font: isRoot
                            ? { color: '#ffffff', size: 12, strokeWidth: 0, face: 'Microsoft YaHei' }
                            : { color: '#334155', size: 11, strokeWidth: 3,
                                strokeColor: '#ffffff', face: 'Microsoft YaHei' }
                    });
                });
                g.links.forEach(l => {
                    relCnt[l.type] = (relCnt[l.type] || 0) + 1;
                    const near = (l.source === name || l.target === name);
                    edges.add({
                        from: l.source, to: l.target,
                        /* 关系名改由悬停提示，不再在连线上写文字 */
                        title: `${l.source} —（${l.type}）→ ${l.target}`,
                        color: { color: REL_COLOR[l.type] || '#c8d4e2', opacity: near ? .95 : .5 },
                        width: near ? 1.6 : .8
                    });
                });
                network.setData({ nodes, edges });
                document.getElementById('netBadge').textContent =
                    `${name} · ${g.nodes.length} 节点 / ${g.links.length} 关系 · 单击节点继续展开`;
                renderDemo(name, p, g, relCnt);
            }).catch(e => {
                document.getElementById('netBadge').textContent = '加载失败：' + e.message;
            });
        }

        function renderDemo(name, profile, graph, relCnt) {
            const wrap = document.getElementById('demoContent');
            document.getElementById('demoTitle').textContent = name + ' 知识分类展示';
            let html = '';

            /* 属性卡 */
            const props = (profile && profile.props) || {};
            const kv = Object.entries(props).filter(([k, v]) => k !== 'name' && v !== null && v !== '');
            if (kv.length) {
                html += `<div class="demo-item" style="grid-column:1/-1;background:#eef3fb;border-color:#dbe7f8">
                    <div class="demo-item-title">结构化属性（可直接参与数值推理）</div>
                    <div class="attrs">${kv.map(([k, v]) => `<span>${k}：</span>${v}`).join('　|　')}</div></div>`;
            }

            /* 关系分组（按固定顺序优先，其余追加） */
            const rels = Object.keys(relCnt).filter(r => (relCnt[r] || 0) > 0);
            const ordered = GROUP_ORDER.filter(r => rels.includes(r))
                .concat(rels.filter(r => !GROUP_ORDER.includes(r)));
            const byRel = {};
            (graph.links || []).forEach(l => {
                const other = l.source === name ? l.target : (l.target === name ? l.source : null);
                if (other && other !== name) (byRel[l.type] = byRel[l.type] || []).push(other);
            });
            const seen = {};
            ordered.forEach(rel => {
                const items = (byRel[rel] || []).filter(x => { if (seen[rel + x]) return false; seen[rel + x] = 1; return true; });
                if (!items.length) return;
                const col = REL_COLOR[rel] || '#94a3b8';
                html += `<div class="demo-item">
                    <div class="demo-item-title" style="color:${col}">${GROUP_TITLE[rel] || rel}（${items.length}）</div>
                    <div>${items.map(t => `<span class="node-tag" style="background:${col}"
                        onclick="drillTo('${t.replace(/'/g, "\\'")}')">${t}</span>`).join('')}</div></div>`;
            });

            /* 被引用（反向关系） */
            const inc = (profile && profile.incoming) || {};
            Object.keys(inc).slice(0, 6).forEach(rel => {
                const items = inc[rel].map(x => x.name);
                if (!items.length) return;
                html += `<div class="demo-item">
                    <div class="demo-item-title" style="color:#6b7280">被引用：${rel}（${items.length}）</div>
                    <div>${items.slice(0, 18).map(t => `<span class="node-tag" style="background:#94a3b8"
                        onclick="drillTo('${t.replace(/'/g, "\\'")}')">${t}</span>`).join('')}</div></div>`;
            });

            if (!html) html = `<div class="empty-tip">暂无 ${name} 的分类信息</div>`;
            wrap.innerHTML = html;
            /* 换实体后左侧回到顶部 —— 否则内容变了、滚动条还停在半中间，
               看着像"点了个标签但页面没动" */
            const sec = document.querySelector('.demo-section');
            if (sec) sec.scrollTop = 0;
        }
    </script>
</body>
</html>
