<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物候期提醒 · 今天该干什么</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#f4f6f9;color:#1f2937}
header{background:linear-gradient(100deg,#2F5597,#3f7d5f);color:#fff;padding:12px 22px;display:flex;align-items:baseline;gap:15px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:600}
header span{font-size:12.5px;opacity:.88}
.wrap{max-width:1320px;margin:0 auto;padding:16px;display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(15,23,42,.08);padding:15px 17px}
.panel h2{font-size:14px;font-weight:600;color:#374151;margin-bottom:12px}
label{display:block;font-size:12.5px;color:#64748b;margin:9px 0 4px}
input,select{width:100%;padding:8px 11px;border:1px solid #cbd5e1;border-radius:7px;font-size:13.5px;font-family:inherit;outline:none;background:#fff}
input:focus,select:focus{border-color:#2F5597;box-shadow:0 0 0 3px rgba(47,85,151,.12)}
button{font-family:inherit;font-size:13px;padding:8px 16px;border-radius:7px;border:1px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer}
button:hover{border-color:#2F5597;color:#2F5597}
button.pri{background:#2F5597;border-color:#2F5597;color:#fff}
button.pri:hover{background:#26477c;color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.full{width:100%;margin-top:14px}
.hint{font-size:11.5px;color:#94a3b8;line-height:1.7;margin-top:9px}
.notice{background:#fdf3e3;color:#96631a;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:11px}
.tag{display:inline-block;border-radius:5px;padding:1.5px 8px;font-size:11.5px;margin:2px 4px 2px 0}
.tag.red{background:#fdecec;color:#b3261e}
.tag.amber{background:#fdf3e3;color:#96631a}
.tag.green{background:#e9f5ee;color:#2b6b47}
.tag.gray{background:#f1f5f9;color:#64748b}
.tag.blue{background:#eef3fb;color:#2F5597}
.empty{color:#94a3b8;font-size:13px;padding:10px 0}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #cbd5e1;border-top-color:#2F5597;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------------- 左栏：滚动时固定，内容超高则栏内独立滚动 ---------------- */
.side{position:sticky;top:14px;max-height:calc(100vh - 30px);overflow-y:auto;overscroll-behavior:contain;
      padding:2px 6px 4px 2px;scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
.side::-webkit-scrollbar{width:7px}
.side::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
.side::-webkit-scrollbar-track{background:transparent}

/* ---------------- 右侧：九宫格 ---------------- */
.ph-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ph-head h2{margin:0}
.cnt{font-weight:400;color:#94a3b8;font-size:12px}
.sowbox{margin:0 0 0 auto;font-size:12px;color:#64748b;display:flex;align-items:center;gap:7px;white-space:nowrap}
.sowbox input{width:auto;padding:5px 9px;font-size:12.5px}
.cellgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cell{position:relative;display:block;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;background:#fff;
      text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
.cell:hover{border-color:#2F5597;box-shadow:0 5px 18px rgba(47,85,151,.17);transform:translateY(-2px)}
.cell-img{position:relative;height:122px;background-size:cover;background-position:center;display:flex;align-items:flex-end}
.cell-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0) 38%,rgba(15,23,42,.68))}
.cell-stage{position:relative;z-index:1;margin:0 0 8px 10px;color:#fff;font-size:15px;font-weight:600;
            text-shadow:0 1px 4px rgba(0,0,0,.55);line-height:1.25}
.cell-day{position:absolute;right:8px;top:8px;z-index:1;background:rgba(255,255,255,.93);color:#2F5597;
          border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600}
.cell-body{padding:9px 11px 10px}
.cell-body>b{font-size:14px;color:#1f2937}
.cell-meta{font-size:11.5px;color:#94a3b8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:#eef2f7;border-radius:4px;overflow:hidden;margin:7px 0 0}
.bar em{display:block;height:100%;background:linear-gradient(90deg,#2F5597,#3f7d5f);border-radius:4px}
.cell-tags{margin-top:7px;line-height:1.1}
.stage-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.stage-chip{font-size:11px;padding:2px 9px;border-radius:12px;background:#eef3fb;color:#2F5597;
            border:1px solid #d3e2f7;cursor:pointer;white-space:nowrap}
.stage-chip:hover{background:#2F5597;color:#fff}
.cell-del{position:absolute;left:6px;top:6px;z-index:2;width:22px;height:22px;border-radius:50%;border:none;
          background:rgba(15,23,42,.5);color:#fff;font-size:15px;line-height:1;padding:0;cursor:pointer;
          opacity:0;transition:opacity .15s}
.cell:hover .cell-del{opacity:1}
.cell-del:hover{background:#b3261e;border-color:#b3261e;color:#fff}
.cellmore{display:flex;justify-content:center;margin-top:12px}
.cellmore button{font-size:12.5px;padding:6px 20px}

@media(max-width:1500px){.cellgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1000px){
  .wrap{grid-template-columns:1fr}
  .cellgrid{grid-template-columns:1fr}
  .side{position:static;max-height:none;overflow:visible;padding:0}
}
</style>
</head>
<body>
    {% include '_nav.html' %}
<header>
  <h1>物候期提醒</h1>
  <span>填一次播种日期，之后每天打开就知道"今天该干什么"</span>
</header>

<div class="wrap">
  <!-- ===================== 左栏（滚动时固定） ===================== -->
  <div class="side">
    <div class="panel">
      <h2>添加 / 更新地块</h2>
      <div id="dbNotice" class="notice" style="display:none"></div>
      <label>地块名称</label>
      <input id="plotName" placeholder="例如：村东头 3 亩地" autocomplete="off">
      <label>种植作物</label>
      <select id="cropSel"><option value="">加载中…</option></select>
      <label>播种日期</label>
      <input id="sowDate" type="date">
      <label>土质（土壤类型）</label>
      <select id="soilSel"><option value="">加载中…</option></select>
      <label>土壤 pH（选填）</label>
      <input id="phInput" type="number" min="0" max="14" step="0.1"
             placeholder="如 6.5　选土质会自动带入典型值，可改成自己测的">
      <div class="hint" id="phHint" style="display:none"></div>
      <div class="row2">
        <div>
          <label>面积（亩）</label>
          <input id="areaMu" type="number" min="0" step="0.1" placeholder="选填">
        </div>
        <div>
          <label>所在地区</label>
          <input id="region" placeholder="选填" autocomplete="off">
        </div>
      </div>
      <button class="pri full" id="saveBtn" onclick="savePlot()">保存地块</button>
      <div class="hint">保存后每次打开本页都会自动按当天日期重算提醒；同名地块会覆盖更新。</div>
    </div>

    <div class="panel" style="margin-top:14px">
      <h2>不存档案 · 快速推算</h2>
      <label>作物</label>
      <select id="qCrop"><option value="">加载中…</option></select>
      <label>播种日期</label>
      <input id="qSow" type="date">
      <label>土质（土壤类型）</label>
      <select id="qSoil"><option value="">-- 请选择（选填）--</option></select>
      <button class="full" onclick="quickCheck()">立即推算</button>
      <div class="hint">不保存档案，直接跳到该作物的物候详情页。</div>
    </div>
  </div>

  <!-- ===================== 右栏：九宫格 ===================== -->
  <div>
    <div class="panel">
      <div class="ph-head">
        <h2>我的地块 <span class="cnt" id="plotCount"></span></h2>
      </div>
      <div class="cellgrid" id="plotGrid"><span class="spin"></span><span class="empty">加载中…</span></div>
    </div>

    <div class="panel" style="margin-top:14px">
      <div class="ph-head">
        <h2 id="cropHead">全部作物 · 生育期一览 <span class="cnt" id="cropCount"></span></h2>
      </div>
      <div class="hint" id="cropHint" style="margin:0 0 12px">
        这里展示图谱中每种作物的各个生育期（未种植的作物不推算"现在处于哪一阶段"）。
        点击作物卡片查看完整提醒；点击某个时期小方块，可直接查看该时期的形态与农事。
      </div>
      <div class="cellgrid" id="cropGrid"><span class="spin"></span><span class="empty">加载中…</span></div>
      <div class="cellmore" id="cropMore" style="display:none">
        <button onclick="cropLimit += 18; renderCropGrid()">显示更多作物</button>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='day_rollover.js') }}"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* ⚠ 用本地日期：new Date().toISOString() 是 UTC，东八区早上 8 点前会算成前一天 */
const todayStr = DayRollover.todayStr();
$('sowDate').value = todayStr;
$('qSow').value = todayStr;

/* 没有实拍图时按阶段给一个渐变色块，保证格子不留白 */
function stageGradient(short){
  const s = String(short || '');
  const rules = [
    [['播种','出苗','育苗','萌芽','移栽','定植','缓苗','直播'], 'linear-gradient(135deg,#d8ecc9,#7fb069)'],
    [['苗期','幼苗','分蘖','分枝','发棵','莲座','团棵','伸蔓','抽梢','幼龄','营养生长'], 'linear-gradient(135deg,#b6dca6,#3f8f4a)'],
    [['拔节','蕾','花芽','现蕾','孕穗','抽穗','开花','授粉','花铃','生殖生长'], 'linear-gradient(135deg,#f7dc93,#c99a2e)'],
    [['灌浆','结荚','鼓粒','膨大','结球','块茎','块根','淀粉','角果','果实','坐果','浆果','糖分','根茎'], 'linear-gradient(135deg,#f0c45f,#b8830f)'],
    [['成熟','收获','采收','采摘','吐絮','转色','着色','休眠','落叶','越冬','采挖'], 'linear-gradient(135deg,#dcac6b,#8f5f26)']
  ];
  for(const [kws, g] of rules){ if(kws.some(k => s.includes(k))) return g; }
  return 'linear-gradient(135deg,#9fc3e8,#3f7d5f)';
}

/* ---------------------------------------- 基础下拉：作物 / 土质 */
fetch('/api/phenology/crops').then(r => r.json()).then(list => {
  if(!Array.isArray(list) || !list.length){ $('cropSel').innerHTML = '<option value="">暂无数据</option>'; return; }
  const opts = list.map(c => `<option value="${esc(c.name)}">${esc(c.name)}（${c.stages} 个阶段${c.total_days ? ' · 全生育期 ' + c.total_days + ' 天' : ''}）</option>`).join('');
  $('cropSel').innerHTML = '<option value="">-- 请选择 --</option>' + opts;
  $('qCrop').innerHTML  = '<option value="">-- 请选择 --</option>' + opts;
}).catch(() => { $('cropSel').innerHTML = '<option value="">加载失败</option>'; });

/* 土质 → {v: 典型 pH 数值, t: 该土类的酸碱度范围文本}
   v 来自图谱的「酸碱度典型值」（由 `酸碱度` 范围取中点算得）。
   选了土质就把 v 自动填进 pH 输入框；农户仍可改成自己实测的值。 */
const SOIL_PH = {};
let phAuto = null;        /* 最近一次自动填入的值，用来判断用户有没有动过手 */

fetch('/api/soil/list').then(r => r.json()).then(list => {
  if(!Array.isArray(list) || !list.length){
    $('soilSel').innerHTML = '<option value="">暂无数据</option>';
    return;
  }
  list.forEach(s => {
    const n = Number(s.ph_value);
    const ok = s.ph_value !== null && s.ph_value !== undefined && s.ph_value !== ''
               && isFinite(n) && n >= 0 && n <= 14;
    SOIL_PH[s.name] = {v: ok ? n : null, t: s.ph || ''};
  });
  const opts = list.map(s => {
    const bits = [s.texture].filter(Boolean).join(' · ');
    const fix = (s.fixes || []).filter(Boolean).length ? '　改良剂：' + s.fixes.filter(Boolean).join('/') : '';
    return `<option value="${esc(s.name)}">${esc(s.name)}${bits ? '（' + esc(bits) + '）' : ''}${esc(fix)}</option>`;
  }).join('');
  $('soilSel').innerHTML = '<option value="">-- 请选择（选填）--</option>' + opts;
  $('qSoil').innerHTML   = '<option value="">-- 请选择（选填）--</option>' + opts;
}).catch(() => { $('soilSel').innerHTML = '<option value="">加载失败</option>'; });

function fillPhFromSoil(){
  const name = $('soilSel').value;
  const info = name ? SOIL_PH[name] : null;
  const box = $('phHint');
  const v = info && info.v !== null ? info.v.toFixed(1) : null;

  if(v !== null){
    phAuto = v;
    $('phInput').value = v;
    box.style.display = '';
    box.innerHTML = '已按「' + esc(name) + '」带入典型值 <b>' + v + '</b>'
      + (info.t ? '（该土类常见范围 ' + esc(info.t) + '）' : '')
      + '。参考值，可改成实测值；清空则不按 pH 给建议。';
    return;
  }

  /* 没选土质 / 该土质没有典型值：只有当框里还是上次自动填的、农户没动过手时才清掉，
     免得把人家自己敲进去的实测值擦掉 */
  if(phAuto !== null && $('phInput').value.trim() === phAuto){
    $('phInput').value = '';
    phAuto = null;
  }
  box.style.display = 'none';
  box.textContent = '';
}
$('soilSel').addEventListener('change', fillPhFromSoil);

/* ---------------------------------------- 格子渲染 */
function gridCell(c, kind){
  const img = c.image
    ? `<div class="cell-img" style="background-image:url('${c.image}')"></div>`
    : `<div class="cell-img" style="background:${stageGradient(c.stage_short)}"></div>`;
  let dayTag = '';
  if(c.status === 'growing' && c.day_no) dayTag = `第 ${c.day_no}/${c.total_days || '?'} 天`;
  else if(c.status === 'before_sow')     dayTag = '未播种';
  else if(c.status === 'done')           dayTag = '已过生育期';
  const stageName = c.stage_short || '暂无生育期数据';
  const pct = Math.max(2, Math.min(100, c.percent || 0));
  const sub = kind === 'plot'
    ? `${esc(c.plot_name || '未命名地块')}${c.area_mu ? ' · ' + c.area_mu + ' 亩' : ''}`
    : `${c.season ? esc(c.season) + '播 · ' : ''}${c.stage_count || 0} 个阶段${c.regions ? ' · ' + c.regions + ' 个主产区' : ''}`;
  const riskTags = (c.top_risks || []).length
    ? `<span class="tag red">防 ${esc((c.top_risks || []).map(r => r.name).join('、'))}${c.risk_count > 3 ? ' 等' + c.risk_count + '项' : ''}</span>`
    : '';
  const nextTag = (c.status === 'growing' && c.next_stage && c.days_to_next != null)
    ? `<span class="tag amber">${c.days_to_next} 天后${esc(c.next_stage)}</span>` : '';
  /* 农户手填的土壤 pH（没填就不显示） */
  const phTag = (kind === 'plot' && c.plot_ph !== null && c.plot_ph !== undefined && c.plot_ph !== '')
    ? `<span class="tag blue">pH ${esc(c.plot_ph)}</span>` : '';
  const delBtn = kind === 'plot'
    ? `<button class="cell-del" title="删除该地块" onclick="return delPlot(event, ${c.plot_id})">&times;</button>` : '';
  return `<a class="cell" href="${c.url}" title="${esc(c.status_text || '')}">
    ${img}
    ${dayTag ? `<span class="cell-day">${dayTag}</span>` : ''}
    <span class="cell-stage">${esc(stageName)}</span>
    <div class="cell-body">
      <b>${esc(c.crop)}</b>
      <div class="cell-meta">${sub}</div>
      ${c.status === 'growing' ? `<div class="bar"><em style="width:${pct}%"></em></div>` : ''}
      <div class="cell-tags">${riskTags}${nextTag}${phTag}</div>
    </div>
    ${delBtn}
  </a>`;
}

/* ---------------------------------------- 我的地块 */
function loadPlotGrid(){
  $('plotGrid').innerHTML = '<span class="spin"></span><span class="empty">加载中…</span>';
  fetch('/api/grid/plots').then(r => r.json()).then(d => {
    const cells = d.cells || [];
    if(d.available === false){
      /* 读不到就说清是哪一边的问题：
         · reason=graph → 图谱没连上：地块还在，只是算不出今天该干什么，保存不受影响
         · reason=db    → MySQL 没连上：保存也存不进去，把保存按钮禁掉 */
      const isGraph = d.reason === 'graph';
      $('dbNotice').style.display = 'block';
      $('dbNotice').innerHTML = (isGraph ? '连不上知识图谱，暂时算不出每块地现在处于哪个生育期。'
                                         : '读不到地块档案（' + esc(d.error || '数据库未连接') + '）。')
        + '仍可用左侧「快速推算」或下方作物宫格。';
      if(!isGraph) $('saveBtn').disabled = true;
      $('plotCount').textContent = '';
      $('plotGrid').innerHTML = '<div class="empty">'
        + (isGraph ? '图谱恢复后刷新本页即可看到地块。' : '数据库恢复后刷新本页即可看到地块。') + '</div>';
      return;
    }
    $('plotCount').textContent = cells.length ? '共 ' + cells.length + ' 块' : '';
    if(!cells.length){
      $('plotGrid').innerHTML = '<div class="empty">还没有地块档案。在左侧填入地块名称、作物和播种日期，保存后这里会出现它的格子，并每天自动更新提醒。</div>';
      return;
    }
    $('plotGrid').innerHTML = cells.map(c => gridCell(c, 'plot')).join('');
  }).catch(e => $('plotGrid').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>');
}
loadPlotGrid();
/* 过了零点，地块格子里的生育期进度 / 倒计时得按新的一天重算。
   ⚠ 只刷地块宫格：左侧表单是用户填的东西不能动，作物宫格是静态浏览卡、跟日期无关，
      重刷还会把「显示更多」的展开状态收回去 */
DayRollover.watch(function(){ loadPlotGrid(); });

/* ---------------------------------------- 全部作物 */
let cropLimit = 18, cropCells = [];
function renderCropGrid(){
  if(!cropCells.length) return;
  const shown = cropCells.slice(0, cropLimit);
  $('cropGrid').innerHTML = shown.map(c => browseCell(c)).join('');
  $('cropCount').textContent = '共 ' + cropCells.length + ' 个作物' + (cropLimit < cropCells.length ? '，已显示前 ' + shown.length + ' 个' : '');
  $('cropMore').style.display = cropLimit < cropCells.length ? 'flex' : 'none';
}
/* 全部作物：浏览卡（只列生育期，不推算当前阶段） */
function browseCell(c){
  const stages = c.stages || [];
  const firstShort = (stages[0] && stages[0].short) || '';
  const img = c.image
    ? `<div class="cell-img" style="background-image:url('${c.image}')"></div>`
    : `<div class="cell-img" style="background:${stageGradient(firstShort)}"></div>`;
  const chips = stages.map(s =>
    `<span class="stage-chip" data-sow="${sowForStage(s.start)}" title="${esc(s.name)}（第 ${s.start}~${s.end} 天）">${esc(s.short || s.name)}</span>`
  ).join('');
  const sub = `${c.season ? esc(c.season) + '播 · ' : ''}共 ${c.stage_count || stages.length} 个生育期`
            + `${c.total_days ? ' · 全生育期 ' + c.total_days + ' 天' : ''}`
            + `${c.regions ? ' · ' + c.regions + ' 个主产区' : ''}`;
  return `<a class="cell" href="${c.url}" title="点击查看该作物的完整生育期提醒">
    ${img}
    <span class="cell-stage">${stages.length ? esc(firstShort) : '暂无生育期数据'}</span>
    <div class="cell-body">
      <b>${esc(c.crop)}</b>
      <div class="cell-meta">${sub}</div>
      <div class="stage-chips">${chips}</div>
    </div>
  </a>`;
}
/* 点某个时期方块 → 以"恰好落在该阶段第一天"的播种日期打开详情 */
function sowForStage(start){
  const d = new Date(Date.now() - Math.max(0, (start - 1)) * 86400000);
  return DayRollover.todayStr(d);   // 同上：本地日期，别用 toISOString
}
function loadCropGrid(){
  $('cropGrid').innerHTML = '<span class="spin"></span><span class="empty">正在从图谱读取各作物的生育期…</span>';
  fetch('/api/grid/crops')
    .then(r => r.json()).then(d => {
      cropCells = d.crops || [];
      cropLimit = 18;
      if(d.available === false){       // 图谱没连上：说清原因，别报"没有这个作物"
        $('cropGrid').innerHTML = '<div class="empty">' + esc(d.error || '读取失败') + '</div>';
        return;
      }
      /* 被管理端限定了可种植范围 → 只列授权作物，标题与说明也跟着换说法。
         否则标题写"全部作物"、实际只列出两三种，看着像报错。 */
      const limited = !!d.limited;
      $('cropHead').firstChild.nodeValue =
        limited ? '可种植作物 · 生育期一览 ' : '全部作物 · 生育期一览 ';
      $('cropHint').textContent = limited
        ? '这里只展示管理端授权给你的作物（未授权的作物不显示，如需增加请联系管理员）。'
          + '未种植的作物不推算"现在处于哪一阶段"。点击作物卡片查看完整提醒；'
          + '点击某个时期小方块，可直接查看该时期的形态与农事。'
        : '这里展示图谱中每种作物的各个生育期（未种植的作物不推算"现在处于哪一阶段"）。'
          + '点击作物卡片查看完整提醒；点击某个时期小方块，可直接查看该时期的形态与农事。';
      if(!cropCells.length){
        $('cropGrid').innerHTML = '<div class="empty">'
          + (limited ? '管理端授权给你的作物暂时还没有生育期数据，请联系管理员核对授权。'
                     : '图谱里还没有带生育期数据的作物。') + '</div>';
        return;
      }
      renderCropGrid();
    }).catch(e => $('cropGrid').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>');
}
loadCropGrid();
$('cropGrid').addEventListener('click', function(e){
  const chip = e.target.closest('.stage-chip');
  if(!chip) return;
  e.preventDefault();
  const cell = chip.closest('.cell');
  location.href = cell.getAttribute('href').split('?')[0] + '?sow=' + chip.dataset.sow;
});

/* ---------------------------------------- 保存 / 删除地块 */
function savePlot(){
  const body = {
    plot_name: $('plotName').value.trim(),
    crop: $('cropSel').value,
    sow_date: $('sowDate').value,
    soil: $('soilSel').value,
    ph: $('phInput').value.trim(),
    area_mu: $('areaMu').value,
    region: $('region').value.trim()
  };
  if(!body.crop || !body.sow_date){ alert('请选择作物并填写播种日期'); return; }
  if(!body.plot_name) body.plot_name = body.crop + '地块';
  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = '保存中…';
  fetch('/api/plot/save', {method:'POST', headers:{'Content-Type':'application/json'},
                           body: JSON.stringify(body)})
    .then(r => r.json()).then(d => {
      if(!d.ok) alert(d.message || '保存失败');
      else {
        $('plotName').value = '';
        $('phInput').value = '';
        phAuto = null;
        fillPhFromSoil();      /* 土质没被重置，pH 跟着它重新对齐，别留下半截状态 */
        loadPlotGrid();
      }
    }).catch(e => alert('保存失败：' + e.message))
    .finally(() => { btn.disabled = false; btn.textContent = '保存地块'; });
}

function delPlot(ev, id){
  ev.preventDefault(); ev.stopPropagation();       // 别让点删除变成点格子跳转
  if(!confirm('确定删除这块地？')) return false;
  fetch('/api/plot/delete', {method:'POST', headers:{'Content-Type':'application/json'},
                             body: JSON.stringify({id: id})})
    .then(() => loadPlotGrid());
  return false;
}

/* ---------------------------------------- 快速推算 → 跳详情页 */
function quickCheck(){
  const crop = $('qCrop').value, sow = $('qSow').value, soil = $('qSoil').value;
  if(!crop || !sow){ alert('请选择作物并填写播种日期'); return; }
  location.href = '/crop/' + encodeURIComponent(crop) +
                  '?sow=' + encodeURIComponent(sow) +
                  (soil ? '&soil=' + encodeURIComponent(soil) : '');
}
