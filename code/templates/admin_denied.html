<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需要管理端账号 · 穗知未来</title>
<style>
:root{--blue:#2F5597; --ink:#1f2937; --ink-2:#4b5563; --ink-3:#94a3b8; --line:#e6ebf2;}
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    background:#f4f6f9; color:var(--ink); min-height:100vh;
    -webkit-font-smoothing:antialiased;
}
header{
    background:linear-gradient(100deg,#2F5597,#3f7d5f); color:#fff;
    padding:12px 22px; display:flex; align-items:baseline; gap:15px; flex-wrap:wrap;
}
header h1{font-size:18px;font-weight:600}
header span{font-size:12.5px;opacity:.88}
.wrap{max-width:760px;margin:0 auto;padding:34px 16px 40px}
.box{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:26px 28px;
}
.box h2{font-size:17px; font-weight:600; margin-bottom:12px}
.box p{font-size:13.5px; color:var(--ink-2); line-height:1.95}
.box .role{
    display:inline-block; font-size:12px; background:#eef3fb; color:var(--blue);
    border-radius:6px; padding:2px 9px; margin-left:6px;
}
.acts{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px}
.acts a{
    font-size:13px; text-decoration:none; padding:9px 18px; border-radius:9px;
    border:1px solid #cbd5e1; color:#334155; background:#fff; transition:.15s;
}
.acts a:hover{border-color:var(--blue); color:var(--blue)}
.acts a.pri{border-color:var(--blue); background:var(--blue); color:#fff}
.acts a.pri:hover{background:#24406f; border-color:#24406f; color:#fff}
</style>
</head>
<body>
    {% include '_nav.html' %}
<header>
    <h1>管理端</h1>
    <span>添加用户端账号 · 指定能种的作物与可用的土质</span>
</header>

<div class="wrap">
    <div class="box">
        <h2>当前账号不是管理端</h2>
        <p>
            你正以 <b>{{ username }}</b><span class="role">用户端</span> 登录。<br>
            管理端用来添加用户端账号，并指定每个账号能种哪些作物、能用哪些土质，
            所以只对管理端账号开放。
        </p>
        <p style="margin-top:12px">
            如果需要管理端权限，可以让已有的管理端把你的账号加为管理端，
            或者退出后用管理端账号重新登录。
        </p>
        <div class="acts">
            <a class="pri" href="{{ url_for('success') }}">返回工作台</a>
            <a href="{{ url_for('todo_page') }}">去今日待办</a>
            <a href="{{ url_for('logout') }}">切换账号</a>
        </div>
    </div>
</div>
</body>
</html>
